<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꽃사남매 쿠폰</title>
    <link rel="icon" href="favico.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- 🎊 폭죽 애니메이션 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #fce4ec;
            background-image: radial-gradient(#fff 15%, transparent 16%), radial-gradient(#fff 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }

        /* ⚡ 차감 시 화면 전체가 붉게 변하며 흔들리는 효과 */
        body.shake-danger {
            background-color: #ffcccc !important;
            animation: shake-hard 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake-hard {

            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translate3d(-10px, 0, 0);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translate3d(10px, 0, 0);
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: opacity 0.5s ease;
            width: 100%;
            max-width: 850px;
        }

        button:focus,
        input:focus {
            outline: 5px solid #ff4081;
            outline-offset: 4px;
            transform: scale(1.08) translateY(-2px) !important;
            box-shadow: 0 10px 20px rgba(255, 64, 129, 0.4) !important;
            z-index: 10;
        }

        button:active,
        button.pressed {
            transform: scale(0.95) translateY(4px) !important;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0) !important;
            filter: brightness(0.9);
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            color: #555;
            border: 2px solid #ddd;
            border-radius: 15px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px auto 0;
            width: 260px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: linear-gradient(135deg, #ffffff, #fff0f5);
            border: 4px dashed #ffb6c1;
            border-radius: 25px;
            padding: 20px 10px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            animation: float 4s ease-in-out infinite;
        }

        .card:nth-child(1) {
            animation-delay: 0s;
            border-color: #ffb6c1;
        }

        .card:nth-child(2) {
            animation-delay: 1s;
            border-color: #ffd700;
        }

        .card:nth-child(3) {
            animation-delay: 2s;
            border-color: #87cefa;
        }

        .card:nth-child(4) {
            animation-delay: 3s;
            border-color: #98fb98;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 26px;
            color: #444;
        }

        .balance-box {
            background: white;
            border: 2px solid #eee;
            border-radius: 15px;
            padding: 12px;
            font-size: 28px;
            color: #ff4081;
            margin-bottom: 20px;
            font-weight: bold;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .action-btn {
            font-family: 'Jua', sans-serif;
            color: white;
            border: none;
            padding: 12px 0;
            width: 90%;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .btn-issue {
            background: linear-gradient(to bottom, #ffd700, #ff8c00);
            box-shadow: 0 6px 0 #d26900;
        }

        .btn-deduct {
            background: linear-gradient(to bottom, #7e57c2, #4527a0);
            box-shadow: 0 6px 0 #311b92;
        }

        .btn-cash {
            background: linear-gradient(to bottom, #4caf50, #2e7d32);
            box-shadow: 0 6px 0 #1b5e20;
        }

        .btn-cash:disabled {
            background: #d3d3d3;
            box-shadow: 0 6px 0 #a9a9a9;
            color: #888;
            text-shadow: none;
        }

        .fun-title {
            color: #ff6b81;
            font-size: 32px;
            margin-top: 0;
            text-shadow: 2px 2px 0px #ffeaa7;
        }

        /* 🔒 팝업(모달) 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: scale(0.8);
            transition: transform 0.3s;
        }

        .modal-box h2 {
            color: #333;
            margin-top: 0;
        }

        .pin-input {
            font-family: 'Jua', sans-serif;
            font-size: 24px;
            padding: 10px;
            width: 80%;
            text-align: center;
            border: 3px solid #ddd;
            border-radius: 10px;
            margin: 15px 0;
            outline: none;
        }

        .amt-btn {
            font-family: 'Jua', sans-serif;
            font-size: 20px;
            padding: 15px;
            margin: 5px;
            width: 40%;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            background-color: #2196F3;
            box-shadow: 0 4px 0 #0b7dda;
            transition: transform 0.1s;
        }

        .close-btn {
            background: #ccc;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Jua', sans-serif;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 1. 로그인 화면 -->
    <div class="container" id="login-section">
        <h1 style="color: #ff6b81; text-shadow: 2px 2px 0px #ffeaa7;">🏠 꽃사남매 은행</h1>
        <p style="color: #666; font-size: 18px;">리모컨의 확인 버튼을 눌러 입장해 주세요!</p>
        <button id="google-login-btn" class="google-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
                style="width: 24px; height: 24px; margin-right: 10px;">
                <path fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                <path fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                <path fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                <path fill="none" d="M0 0h48v48H0z" />
            </svg>
            입장하기
        </button>
    </div>

    <!-- 2. 메인 화면 -->
    <div class="container" id="main-section" style="display: none; opacity: 0;">
        <h2 class="fun-title">🌟 오늘도 반짝반짝 빛나는 하루 🌟</h2>
        <div class="grid-container" id="cards-container">
            <!-- 자바스크립트에서 4명의 카드를 자동으로 그려줍니다 -->
        </div>
    </div>

    <!-- 3. 어른 비밀번호 확인 모달 -->
    <div class="modal-overlay" id="pin-modal">
        <div class="modal-box" id="pin-box">
            <h2>보호자 비밀번호</h2>
            <!-- 숫자 키패드가 바로 뜨도록 설정 -->
            <input type="password" id="pin-input" class="pin-input" inputmode="numeric" pattern="[0-9]*"
                placeholder="비밀번호">
            <br>
            <button class="close-btn" id="pin-cancel">취소</button>
            <button class="close-btn" id="pin-confirm" style="background:#4CAF50; color:white;">확인</button>
        </div>
    </div>

    <!-- 4. 금액 선택 모달 -->
    <div class="modal-overlay" id="amt-modal">
        <div class="modal-box" id="amt-box">
            <h2 id="amt-title">금액 선택</h2>
            <div>
                <button class="amt-btn">100</button>
                <button class="amt-btn">500</button>
                <button class="amt-btn">1000</button>
                <button class="amt-btn">2000</button>
            </div>
            <button class="close-btn" id="amt-cancel">취소</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        // 🔥 increment(더하기/빼기), getDoc(1회 조회) 추가
        import { getFirestore, doc, onSnapshot, updateDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGzJ2suW63ek-hkZ6IVg8t8gQlFmCS2fs",
            authDomain: "flowercoupon-7a748.firebaseapp.com",
            projectId: "flowercoupon-7a748",
            storageBucket: "flowercoupon-7a748.firebasestorage.app",
            messagingSenderId: "182524668070",
            appId: "1:182524668070:web:366e6b863c65d07c25ac67"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        // UI 요소
        const loginSection = document.getElementById('login-section');
        const mainSection = document.getElementById('main-section');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const cardsContainer = document.getElementById('cards-container');

        const pinModal = document.getElementById('pin-modal');
        const pinBox = document.getElementById('pin-box');
        const pinInput = document.getElementById('pin-input');

        const amtModal = document.getElementById('amt-modal');
        const amtBox = document.getElementById('amt-box');
        const amtTitle = document.getElementById('amt-title');

        const kids = [
            { id: '하얀', icon: '🐰' },
            { id: '가을', icon: '🦊' },
            { id: '하늘', icon: '🐶' },
            { id: '한별', icon: '🐻' }
        ];

        // 상태 저장용 변수
        let currentTargetKid = '';
        let currentActionType = ''; // 'issue', 'deduct', 'cash'
        let lastFocusedBtn = null; // 모달 닫힐 때 원래 버튼으로 돌아가기 위함

        // 카드 생성 로직
        kids.forEach(kid => {
            const cardHTML = `
                <div class="card">
                    <h3>${kid.icon} ${kid.id}</h3>
                    <div class="balance-box"><span id="bal-${kid.id}">0</span>원</div>
                    <button class="action-btn btn-issue" data-kid="${kid.id}" data-type="issue">🎁 용돈 받기</button>
                    <button class="action-btn btn-deduct" data-kid="${kid.id}" data-type="deduct">⚡ 차감하기</button>
                    <button class="action-btn btn-cash" data-kid="${kid.id}" data-type="cash" disabled>🏦 현금 교환</button>
                </div>
            `;
            cardsContainer.innerHTML += cardHTML;
        });

        // 실시간 잔액 연동
        function listenToCoupons() {
            kids.forEach(kid => {
                const docRef = doc(db, "coupons", kid.id);
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const balance = docSnap.data().balance;
                        document.getElementById(`bal-${kid.id}`).innerText = balance.toLocaleString();

                        const cashBtn = document.querySelector(`.btn-cash[data-kid="${kid.id}"]`);
                        cashBtn.disabled = balance < 5000;
                    }
                });
            });
        }

        // 로그인 플로우
        function showMainScreen() {
            loginSection.style.opacity = 0;
            setTimeout(() => {
                loginSection.style.display = 'none';
                mainSection.style.display = 'block';
                setTimeout(() => {
                    mainSection.style.opacity = 1;
                    listenToCoupons();
                    const firstBtn = document.querySelector('.btn-issue');
                    if (firstBtn) firstBtn.focus();
                }, 50);
            }, 500);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) showMainScreen();
            else googleLoginBtn.focus();
        });

        googleLoginBtn.addEventListener('click', async () => {
            try { await signInWithPopup(auth, provider); showMainScreen(); }
            catch (error) { console.error(error); }
        });

        // ==========================================
        // 5단계 핵심: 기능 및 모달 로직
        // ==========================================

        // 1. 공통 모달 열기 함수
        function openPinModal(kidId, actionType, sourceBtn) {
            currentTargetKid = kidId;
            currentActionType = actionType;
            lastFocusedBtn = sourceBtn;

            pinInput.value = '';
            pinModal.style.display = 'flex';
            setTimeout(() => {
                pinModal.style.opacity = 1;
                pinBox.style.transform = 'scale(1)';
                pinInput.focus(); // 리모컨 편의성을 위해 인풋에 바로 포커스
            }, 10);
        }

        function closeModal(modalId, boxId) {
            const modal = document.getElementById(modalId);
            const box = document.getElementById(boxId);
            modal.style.opacity = 0;
            box.style.transform = 'scale(0.8)';
            setTimeout(() => {
                modal.style.display = 'none';
                if (lastFocusedBtn) lastFocusedBtn.focus(); // 원래 누르던 버튼으로 복귀
            }, 300);
        }

        // 2. 메인 버튼 클릭 이벤트 바인딩 (이벤트 위임)
        cardsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('action-btn')) {
                const kidId = e.target.getAttribute('data-kid');
                const actionType = e.target.getAttribute('data-type');
                openPinModal(kidId, actionType, e.target);
            }
        });

        // 3. 비밀번호 확인 로직
        async function verifyPin() {
            const enteredPin = pinInput.value;
            if (!enteredPin) return;

            try {
                // 파이어스토어 settings/auth 의 adultPassword 필드 읽기
                const docRef = doc(db, "settings", "auth");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().adultPassword === enteredPin) {
                    // 통과!
                    closeModal('pin-modal', 'pin-box');

                    if (currentActionType === 'cash') {
                        // 현금화는 바로 5000원 차감 및 대형 축하
                        processTransaction(-5000);
                        fireBigConfetti();
                    } else {
                        // 발급/차감은 금액 모달 열기
                        setTimeout(() => {
                            amtTitle.innerText = currentActionType === 'issue' ? '🎁 지급할 금액' : '⚡ 차감할 금액';
                            amtTitle.style.color = currentActionType === 'issue' ? '#2196F3' : '#f44336';

                            // 버튼 색상 변경
                            document.querySelectorAll('.amt-btn').forEach(btn => {
                                btn.style.backgroundColor = currentActionType === 'issue' ? '#2196F3' : '#f44336';
                                btn.style.boxShadow = `0 4px 0 ${currentActionType === 'issue' ? '#0b7dda' : '#d32f2f'}`;
                            });

                            amtModal.style.display = 'flex';
                            setTimeout(() => {
                                amtModal.style.opacity = 1;
                                amtBox.style.transform = 'scale(1)';
                                document.querySelector('.amt-btn').focus();
                            }, 10);
                        }, 300);
                    }
                } else {
                    alert("어른 비밀번호가 틀렸습니다!");
                    pinInput.value = '';
                    pinInput.focus();
                }
            } catch (error) {
                console.error("DB 에러", error);
                alert("서버 연결 오류");
            }
        }

        document.getElementById('pin-confirm').addEventListener('click', verifyPin);
        document.getElementById('pin-cancel').addEventListener('click', () => closeModal('pin-modal', 'pin-box'));
        pinInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyPin(); });

        // 4. 금액 선택 및 DB 업데이트 로직
        document.querySelectorAll('.amt-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const amount = parseInt(btn.innerText);
                const finalAmount = currentActionType === 'issue' ? amount : -amount;

                processTransaction(finalAmount);
                closeModal('amt-modal', 'amt-box');

                // 애니메이션 실행
                if (currentActionType === 'issue') {
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                } else {
                    document.body.classList.add('shake-danger');
                    setTimeout(() => document.body.classList.remove('shake-danger'), 500);
                }
            });
        });

        document.getElementById('amt-cancel').addEventListener('click', () => closeModal('amt-modal', 'amt-box'));

        async function processTransaction(amount) {
            const docRef = doc(db, "coupons", currentTargetKid);
            try {
                // increment를 사용해 기존 값에 더하거나 뺌
                await updateDoc(docRef, { balance: increment(amount) });
            } catch (error) {
                console.error("업데이트 실패", error);
            }
        }

        // 현금화 전용 초대형 폭죽
        function fireBigConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }
            var interval = setInterval(function () {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // ==========================================
        // 📺 리모컨 조작 방향키 / 엔터 효과 (유지)
        // ==========================================
        document.addEventListener('keydown', (e) => {
            // 모달 안팎의 포커스 관리를 위해 querySelector 수정
            if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;

            // 현재 화면에 보이는(display!=none) 모달이 있다면 그 안에서만 포커스 이동
            let focusContainer = document;
            if (pinModal.style.display === 'flex') focusContainer = pinModal;
            else if (amtModal.style.display === 'flex') focusContainer = amtModal;

            const focusables = Array.from(focusContainer.querySelectorAll('button:not([disabled]), input'));
            const currentIndex = focusables.indexOf(document.activeElement);

            if (currentIndex === -1 && focusables.length > 0) {
                focusables[0].focus(); return;
            }
            if (currentIndex === -1) return;

            e.preventDefault();
            let nextIndex = currentIndex;

            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextIndex = (currentIndex + 1) % focusables.length;
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') nextIndex = (currentIndex - 1 + focusables.length) % focusables.length;

            focusables[nextIndex].focus();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement.tagName === 'BUTTON') document.activeElement.classList.add('pressed');
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'Enter' && document.activeElement.tagName === 'BUTTON') document.activeElement.classList.remove('pressed');
        });
    </script>
</body>

</html>
