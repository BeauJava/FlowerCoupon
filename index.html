<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꽃사남매 쿠폰</title>
    <link rel="icon" href="favico.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #fce4ec;
            /* 사랑스러운 핑크빛 배경 */
            background-image: radial-gradient(#fff 15%, transparent 16%), radial-gradient(#fff 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: opacity 0.5s ease;
            width: 100%;
            max-width: 850px;
        }

        /* 📺 리모컨 포커스 강력 조명 효과 */
        button:focus,
        input:focus {
            outline: 5px solid #ff4081;
            outline-offset: 4px;
            transform: scale(1.08) translateY(-2px) !important;
            box-shadow: 0 10px 20px rgba(255, 64, 129, 0.4) !important;
            z-index: 10;
        }

        /* 👆 엔터키/클릭 시 꾹 눌리는 효과 */
        button:active,
        button.pressed {
            transform: scale(0.95) translateY(4px) !important;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0) !important;
            filter: brightness(0.9);
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            color: #555;
            border: 2px solid #ddd;
            border-radius: 15px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px auto 0;
            width: 260px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
        }

        /* 🧸 아이들 카드 둥실둥실 애니메이션 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: linear-gradient(135deg, #ffffff, #fff0f5);
            border: 4px dashed #ffb6c1;
            border-radius: 25px;
            padding: 20px 10px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            animation: float 4s ease-in-out infinite;
        }

        /* 각 카드마다 둥실거리는 타이밍을 다르게 설정 */
        .card:nth-child(1) {
            animation-delay: 0s;
            border-color: #ffb6c1;
        }

        .card:nth-child(2) {
            animation-delay: 1s;
            border-color: #ffd700;
        }

        .card:nth-child(3) {
            animation-delay: 2s;
            border-color: #87cefa;
        }

        .card:nth-child(4) {
            animation-delay: 3s;
            border-color: #98fb98;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 26px;
            color: #444;
        }

        .balance-box {
            background: white;
            border: 2px solid #eee;
            border-radius: 15px;
            padding: 12px;
            font-size: 28px;
            color: #ff4081;
            margin-bottom: 20px;
            font-weight: bold;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* 🎨 독창적인 버튼 디자인 */
        .action-btn {
            font-family: 'Jua', sans-serif;
            color: white;
            border: none;
            padding: 12px 0;
            width: 90%;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* 🎁 발급: 상 받는 화려하고 반짝이는 느낌 */
        .btn-issue {
            background: linear-gradient(to bottom, #ffd700, #ff8c00);
            box-shadow: 0 6px 0 #d26900, 0 8px 10px rgba(0, 0, 0, 0.2);
        }

        /* ⚡ 차감: 벌 받는 무섭고 차가운 느낌 */
        .btn-deduct {
            background: linear-gradient(to bottom, #7e57c2, #4527a0);
            box-shadow: 0 6px 0 #311b92, 0 8px 10px rgba(0, 0, 0, 0.2);
        }

        /* 🏦 현금화: 신뢰감 있는 은행의 초록/황금빛 느낌 */
        .btn-cash {
            background: linear-gradient(to bottom, #4caf50, #2e7d32);
            box-shadow: 0 6px 0 #1b5e20, 0 8px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-cash:disabled {
            background: #d3d3d3;
            box-shadow: 0 6px 0 #a9a9a9;
            color: #888;
            text-shadow: none;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 예쁜 환영 타이틀 */
        .fun-title {
            color: #ff6b81;
            font-size: 32px;
            margin-top: 0;
            text-shadow: 2px 2px 0px #ffeaa7;
        }
    </style>
</head>

<body>

    <!-- 1. 로그인 화면 -->
    <div class="container" id="login-section">
        <h1 style="color: #ff6b81; text-shadow: 2px 2px 0px #ffeaa7;">🏠 꽃사남매 은행</h1>
        <p style="color: #666; font-size: 18px;">리모컨의 확인 버튼을 눌러 입장해 주세요!</p>

        <button id="google-login-btn" class="google-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
                style="width: 24px; height: 24px; margin-right: 10px;">
                <path fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                <path fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                <path fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                <path fill="none" d="M0 0h48v48H0z" />
            </svg>
            입장하기
        </button>
    </div>

    <!-- 2. 메인 화면 -->
    <div class="container" id="main-section" style="display: none; opacity: 0;">
        <!-- 아이들을 위한 예쁜 인사말 -->
        <h2 class="fun-title">🌟 오늘도 반짝반짝 빛나는 하루 🌟</h2>

        <div class="grid-container">
            <!-- 하얀 -->
            <div class="card">
                <h3>🐰 하얀</h3>
                <div class="balance-box"><span id="bal-하얀">0</span>원</div>
                <button class="action-btn btn-issue">🎁 용돈 받기</button>
                <button class="action-btn btn-deduct">⚡ 차감하기</button>
                <button class="action-btn btn-cash" disabled>🏦 현금 교환</button>
            </div>
            <!-- 가을 -->
            <div class="card">
                <h3>🦊 가을</h3>
                <div class="balance-box"><span id="bal-가을">0</span>원</div>
                <button class="action-btn btn-issue">🎁 용돈 받기</button>
                <button class="action-btn btn-deduct">⚡ 차감하기</button>
                <button class="action-btn btn-cash" disabled>🏦 현금 교환</button>
            </div>
            <!-- 하늘 -->
            <div class="card">
                <h3>🐶 하늘</h3>
                <div class="balance-box"><span id="bal-하늘">0</span>원</div>
                <button class="action-btn btn-issue">🎁 용돈 받기</button>
                <button class="action-btn btn-deduct">⚡ 차감하기</button>
                <button class="action-btn btn-cash" disabled>🏦 현금 교환</button>
            </div>
            <!-- 한별 -->
            <div class="card">
                <h3>🐣 한별</h3>
                <div class="balance-box"><span id="bal-한별">0</span>원</div>
                <button class="action-btn btn-issue">🎁 용돈 받기</button>
                <button class="action-btn btn-deduct">⚡ 차감하기</button>
                <button class="action-btn btn-cash" disabled>🏦 현금 교환</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGzJ2suW63ek-hkZ6IVg8t8gQlFmCS2fs",
            authDomain: "flowercoupon-7a748.firebaseapp.com",
            projectId: "flowercoupon-7a748",
            storageBucket: "flowercoupon-7a748.firebasestorage.app",
            messagingSenderId: "182524668070",
            appId: "1:182524668070:web:366e6b863c65d07c25ac67"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        const loginSection = document.getElementById('login-section');
        const mainSection = document.getElementById('main-section');
        const googleLoginBtn = document.getElementById('google-login-btn');

        const kids = ['하얀', '가을', '하늘', '한별'];

        function listenToCoupons() {
            kids.forEach(kid => {
                const docRef = doc(db, "coupons", kid);
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const balance = docSnap.data().balance;
                        document.getElementById(`bal-${kid}`).innerText = balance.toLocaleString();

                        const cashBtn = document.getElementById(`bal-${kid}`).closest('.card').querySelector('.btn-cash');
                        if (balance >= 5000) {
                            cashBtn.disabled = false;
                        } else {
                            cashBtn.disabled = true;
                        }
                    }
                });
            });
        }

        function showMainScreen() {
            loginSection.style.opacity = 0;
            setTimeout(() => {
                loginSection.style.display = 'none';
                mainSection.style.display = 'block';

                setTimeout(() => {
                    mainSection.style.opacity = 1;
                    listenToCoupons();
                    const firstBtn = document.querySelector('.btn-issue');
                    if (firstBtn) firstBtn.focus();
                }, 50);
            }, 500);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                showMainScreen();
            } else {
                googleLoginBtn.focus();
            }
        });

        googleLoginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
                showMainScreen();
            } catch (error) {
                console.error("로그인 에러:", error);
            }
        });

        // --- 📺 방향키(리모컨) 포커스 이동 지원 로직 ---
        document.addEventListener('keydown', (e) => {
            if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;

            const focusables = Array.from(document.querySelectorAll('button:not([disabled]), input'));
            const currentIndex = focusables.indexOf(document.activeElement);

            if (currentIndex === -1) {
                if (focusables.length > 0) focusables[0].focus();
                return;
            }

            e.preventDefault();
            let nextIndex = currentIndex;

            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                nextIndex = (currentIndex + 1) % focusables.length;
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                nextIndex = (currentIndex - 1 + focusables.length) % focusables.length;
            }
            focusables[nextIndex].focus();
        });

        // --- 📺 엔터키 시각 효과 (꾹 눌리는 애니메이션) ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement.tagName === 'BUTTON') {
                document.activeElement.classList.add('pressed');
            }
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'Enter' && document.activeElement.tagName === 'BUTTON') {
                document.activeElement.classList.remove('pressed');
                // 실제 클릭 이벤트는 브라우저가 자동으로 발생시킵니다.
            }
        });
    </script>
</body>

</html>
