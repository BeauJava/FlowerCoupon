<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>꽃사남매 쿠폰</title>
    <link rel="icon" href="favico.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: opacity 0.5s ease;
            width: 100%;
            max-width: 800px;
        }

        /* 📺 리모컨 조작을 위한 강력한 포커스(Focus) 스타일 */
        button:focus {
            outline: 6px solid #ff4081;
            /* 눈에 띄는 핫핑크 테두리 */
            outline-offset: 4px;
            transform: scale(1.05);
            /* 살짝 커지는 효과 */
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.6);
            z-index: 10;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            color: #757575;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px auto 0;
            width: 250px;
            transition: all 0.2s;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: #fff9e6;
            border: 3px solid #ffcc00;
            border-radius: 15px;
            padding: 20px 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #333;
        }

        .balance-box {
            background: white;
            border-radius: 10px;
            padding: 10px;
            font-size: 28px;
            color: #4CAF50;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .action-btn {
            font-family: 'Jua', sans-serif;
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 10px 0;
            /* 리모컨 선택이 쉽도록 버튼을 약간 키웠습니다 */
            width: 90%;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .btn-issue {
            background-color: #2196F3;
        }

        .btn-deduct {
            background-color: #f44336;
        }

        .btn-cash {
            background-color: #4CAF50;
        }

        .btn-cash:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <!-- 1. 로그인 화면 -->
    <div class="container" id="login-section">
        <h1 style="color: #333; margin-bottom: 5px;">🏠 꽃사남매 쿠폰</h1>
        <p style="color: #666;">리모컨의 확인 버튼을 눌러주세요!</p>

        <button id="google-login-btn" class="google-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
                style="width: 24px; height: 24px; margin-right: 10px;">
                <path fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                <path fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                <path fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                <path fill="none" d="M0 0h48v48H0z" />
            </svg>
            Google 계정으로 로그인
        </button>
        <div id="error-msg" style="color:red; margin-top:15px;"></div>
    </div>

    <!-- 2. 메인 화면 -->
    <div class="container" id="main-section" style="display: none; opacity: 0;">
        <h2 style="color: #4CAF50; margin-top: 0;">🎉 <span id="user-info"></span>님, 환영합니다!</h2>

        <div class="grid-container">
            <!-- 하얀 -->
            <div class="card">
                <h3>하얀</h3>
                <div class="balance-box"><span id="bal-하얀">0</span>원</div>
                <button class="action-btn btn-issue">발급</button>
                <button class="action-btn btn-deduct">차감</button>
                <button class="action-btn btn-cash" disabled>현금화</button>
            </div>
            <!-- 가을 -->
            <div class="card">
                <h3>가을</h3>
                <div class="balance-box"><span id="bal-가을">0</span>원</div>
                <button class="action-btn btn-issue">발급</button>
                <button class="action-btn btn-deduct">차감</button>
                <button class="action-btn btn-cash" disabled>현금화</button>
            </div>
            <!-- 하늘 -->
            <div class="card">
                <h3>하늘</h3>
                <div class="balance-box"><span id="bal-하늘">0</span>원</div>
                <button class="action-btn btn-issue">발급</button>
                <button class="action-btn btn-deduct">차감</button>
                <button class="action-btn btn-cash" disabled>현금화</button>
            </div>
            <!-- 한별 -->
            <div class="card">
                <h3>한별</h3>
                <div class="balance-box"><span id="bal-한별">0</span>원</div>
                <button class="action-btn btn-issue">발급</button>
                <button class="action-btn btn-deduct">차감</button>
                <button class="action-btn btn-cash" disabled>현금화</button>
            </div>
        </div>
    </div>

    <!-- 5단계에서 쓰일 어른 비밀번호 입력 모달 (미리 준비만 해둠) -->
    <!-- inputmode="numeric"과 pattern="[0-9]*"을 사용하면 모바일/태블릿에서 숫자기패드가 바로 튀어나옵니다! -->
    <!-- <input type="password" inputmode="numeric" pattern="[0-9]*" id="adult-password"> -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGzJ2suW63ek-hkZ6IVg8t8gQlFmCS2fs",
            authDomain: "flowercoupon-7a748.firebaseapp.com",
            projectId: "flowercoupon-7a748",
            storageBucket: "flowercoupon-7a748.firebasestorage.app",
            messagingSenderId: "182524668070",
            appId: "1:182524668070:web:366e6b863c65d07c25ac67"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        const loginSection = document.getElementById('login-section');
        const mainSection = document.getElementById('main-section');
        const userInfo = document.getElementById('user-info');
        const googleLoginBtn = document.getElementById('google-login-btn');

        // 🔥 Firestore 한글 ID 배열
        const kids = ['하얀', '가을', '하늘', '한별'];

        function listenToCoupons() {
            kids.forEach(kid => {
                // 한글 이름으로 DB에서 문서 호출
                const docRef = doc(db, "coupons", kid);

                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const balance = docSnap.data().balance;
                        // HTML 태그의 ID도 한글로 매핑 (id="bal-하얀")
                        document.getElementById(`bal-${kid}`).innerText = balance.toLocaleString();

                        const cashBtn = document.getElementById(`bal-${kid}`).closest('.card').querySelector('.btn-cash');
                        if (balance >= 5000) {
                            cashBtn.disabled = false;
                        } else {
                            cashBtn.disabled = true;
                        }
                    }
                });
            });
        }

        function showMainScreen(user) {
            loginSection.style.opacity = 0;
            setTimeout(() => {
                loginSection.style.display = 'none';
                mainSection.style.display = 'block';
                userInfo.innerText = user.displayName;

                // 메인 화면 진입 시 첫 번째 버튼(하얀이 발급 버튼)에 강제로 포커스 주기 (리모컨 편의성)
                setTimeout(() => {
                    mainSection.style.opacity = 1;
                    listenToCoupons();
                    const firstBtn = document.querySelector('.btn-issue');
                    if (firstBtn) firstBtn.focus();
                }, 50);
            }, 500);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                showMainScreen(user);
            } else {
                // 로그인 화면일 땐 구글 버튼에 포커스
                googleLoginBtn.focus();
            }
        });

        googleLoginBtn.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                showMainScreen(result.user);
            } catch (error) {
                console.error("로그인 에러:", error);
            }
        });
        // --- 📺 방향키(리모컨) 포커스 이동 지원 로직 ---
        document.addEventListener('keydown', (e) => {
            // 방향키가 아니면 무시
            if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;

            // 현재 화면에서 포커스 가능한(비활성화되지 않은) 모든 버튼과 입력창 찾기
            const focusables = Array.from(document.querySelectorAll('button:not([disabled]), input'));
            const currentIndex = focusables.indexOf(document.activeElement);

            // 포커스된 요소가 없다면 첫 번째 요소에 포커스
            if (currentIndex === -1) {
                if (focusables.length > 0) focusables[0].focus();
                return;
            }

            e.preventDefault(); // 기본 동작(화면 스크롤) 방지

            let nextIndex = currentIndex;

            // 오른쪽이나 아래 방향키를 누르면 다음 버튼으로
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                nextIndex = (currentIndex + 1) % focusables.length;
            }
            // 왼쪽이나 위 방향키를 누르면 이전 버튼으로
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                nextIndex = (currentIndex - 1 + focusables.length) % focusables.length;
            }

            // 다음 대상에 포커스 적용
            focusables[nextIndex].focus();
        });
    </script>
</body>

</html>
